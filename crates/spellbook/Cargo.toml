[package]
name = "sorcerer-spellbook"
description = "Spellbook: a project's conventions as data — generators with holes, and rules that check them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["code-generation", "conventions", "lsp", "tree-sitter", "editor"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "spellbook"

[[bin]]
name = "spellbook"
path = "src/main.rs"

[dependencies]
sorcerer-core.workspace = true
sorcerer-lsp.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
globset.workspace = true
regex.workspace = true
tree-sitter.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Not shipped as a program yet: no installer until the morning's ruling.
[package.metadata.dist]
dist = false

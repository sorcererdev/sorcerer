# Bash: tree-sitter-bash. Core reads the keys in this file; products add their own tables
# (in their milestones) and core keeps those for them.
files = ["**/*.sh", "**/*.bash"]
# What a unit is, as prompts say it.
unit_words = "a function name (name)"
comment = "#"
# The grammar: tree-sitter-bash 0.25.1, fetched, compiled once into the user's cache and
# loaded at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-bash", rev = "a06c2e4415e9bc0346c6b86d401879ffb44058f7" }

[unit]
# A unit's display name on its definition line, when the queries don't say: `function name` or
# `name()`.
name = ['^[[:space:]]*(function[[:space:]]+)?([[:alnum:]_.:-]+)[[:space:]]*(\(\))?[[:space:]]*\{?']

# Bash has no test-file convention; `source ./lib/x.sh` names a file beside the sourcing file
# (conjure reads these).
[imports]
separator = "/"
resolve = ["{= dir =}/{= path =}"]

# The code spellbook writes where a generator leaves a hole: one template per kind, filled with
# the hole's name and instruction. Every placeholder must parse where its kind belongs.
[holes]
expr = "\"hole {= name =}: {= instruction =}\""
block = ": \"hole {= name =}: {= instruction =}\""
# A statement among others, as a fix's `replace` text writes where a statement was.
stmt = ": \"hole {= name =}: {= instruction =}\""

# What spellbook's anchors cannot read from the code: the separator a list of one item, or of
# none, takes when an item is put into it (a longer list shows its own). Bash has no lists.

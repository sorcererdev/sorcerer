# CSS: tree-sitter-css. A markup language: it has no units (scry and conjure never load it),
# spellbook's rules and regions and lackey's comment and hunk cutting read it.
files = ["**/*.css"]
comment = "/*"
comment_end = "*/"
# The grammar: tree-sitter-css v0.25.0, fetched, compiled once into the user's cache and loaded
# at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-css", rev = "dda5cfc5722c429eaba1c910ca32c2c0c5bb1a3f" }

# The code spellbook writes where a generator leaves a hole; each must parse where its kind goes.
[holes]
block = "/* hole {= name =}: {= instruction =} */"
expr = "initial /* hole {= name =}: {= instruction =} */"

# CSS: tree-sitter-css. A markup language: it has no units (scry and conjure never load it),
# spellbook's rules and regions and lackey's comment and hunk cutting read it.
files = ["**/*.css"]
comment = "/*"
comment_end = "*/"
# The grammar: our fork, sorcererdev/tree-sitter-css (branch modern-css): tree-sitter-css v0.25.0 plus
# upstream PR #105, so modern CSS (@container, @layer, range queries) parses. Switch back to upstream
# once that lands (sorcerer issue #6). Fetched, compiled once into the user's cache and loaded at run time.
grammar = { git = "https://github.com/sorcererdev/tree-sitter-css", rev = "ecfa1a086b32c13f6830547cbb4f6fcab82468ae" }

# The code spellbook writes where a generator leaves a hole; each must parse where its kind goes.
[holes]
block = "/* hole {= name =}: {= instruction =} */"
expr = "initial /* hole {= name =}: {= instruction =} */"

# HTML: tree-sitter-html. A markup language: it has no units (scry and conjure never load it),
# spellbook's rules and regions and lackey's comment and hunk cutting read it.
files = ["**/*.html", "**/*.htm"]
comment = "<!--"
comment_end = "-->"
# The grammar: tree-sitter-html v0.23.2, fetched, compiled once into the user's cache and loaded
# at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-html", rev = "5a5ca8551a179998360b4a4ca2c0f366a35acc03" }

# The code spellbook writes where a generator leaves a hole: a comment holds it in any markup.
[holes]
block = "<!-- hole {= name =}: {= instruction =} -->"

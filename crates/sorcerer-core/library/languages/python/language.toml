# Python: tree-sitter-python. Core reads the keys in this file; products add their own tables
# (in their milestones) and core keeps those for them.
files = ["**/*.py"]
# What a unit is, as prompts say it.
unit_words = "a top-level class or function name (Name) or a method (Class.method)"
comment = "#"
# The grammar: tree-sitter-python 0.25.0, fetched, compiled once into the user's cache and
# loaded at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-python", rev = "293fdc02038ee2bf0e2e206711b69c90ac0d413f" }

[unit]
# A unit's display name on its def line, when the queries don't say: the last group.
name = ['^[[:space:]]*(async[[:space:]]+)?(def|class)[[:space:]]+([^[:space:](:[]+)']

# Where a file's tests live, and where an import's file may be (conjure reads these).
[test]
tests_for = "{= dir =}/{= stem =}__test.py"

[imports]
resolve = ["{= path =}.py", "{= path =}/__init__.py", "src/{= path =}.py", "src/{= path =}/__init__.py"]

# The code spellbook writes where a generator leaves a hole: one template per kind, filled with
# the hole's name and instruction. Every placeholder must parse where its kind belongs.
[holes]
ident = "todo_{= name =}"
type = "object"
expr = "None  # hole {= name =}: {= instruction =}"
block = "raise NotImplementedError(\"hole {= name =}: {= instruction =}\")"

# Rust: tree-sitter-rust. Core reads the keys in this file; products add their own tables
# (in their milestones) and core keeps those for them.
files = ["**/*.rs"]
# What a unit is, as prompts say it.
unit_words = "a top-level function, struct, enum or trait name (Name), or a method (Type::method)"
comment = "//"
# A method is named `Type::method`.
unit_separator = "::"
# The grammar: tree-sitter-rust 0.24.2, fetched, compiled once into the user's cache and
# loaded at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-rust", rev = "77a3747266f4d621d0757825e6b11edcbf991ca5" }

[unit]
# A unit's display name on its definition line, when the queries don't say: the last group
# of the first pattern that matches (an impl by its type, a trait impl too, an item by its name).
name = [
  '^[[:space:]]*impl(<.*>)?[[:space:]]+[^{]*[[:space:]]for[[:space:]]+([[:alnum:]_]+)',
  '^[[:space:]]*impl(<.*>)?[[:space:]]+([[:alnum:]_]+)',
  '^[[:space:]]*(pub[^[:space:]]*[[:space:]]+)?((async|const|unsafe|extern)[[:space:]]+)*(fn|struct|enum|trait|mod)[[:space:]]+([[:alnum:]_]+)',
]

# Rust tests live in the file itself; `use crate::a::b` names `src/a/b.rs` (conjure reads these).
[test]
tests_for = "{= dir =}/{= stem =}.rs"

[imports]
resolve = ["src/{= path =}.rs", "src/{= path =}/mod.rs"]
drop_first = ["crate"]

# The code spellbook writes where a generator leaves a hole: one template per kind, filled with
# the hole's name and instruction. Every placeholder must parse where its kind belongs.
[holes]
ident = "todo_{= name =}"
type = "()"
expr = "todo!(\"hole {= name =}: {= instruction =}\")"
block = "todo!(\"hole {= name =}: {= instruction =}\")"

# C#: tree-sitter-c-sharp. Core reads the keys in this file; products add their own tables
# (in their milestones) and core keeps those for them.
files = ["**/*.cs"]
# What a unit is, as prompts say it.
unit_words = "a top-level class, interface, struct, enum or record name (Name) or a method (Class.method)"
comment = "//"
# The grammar: tree-sitter-c-sharp 0.24.0, fetched, compiled once into the user's cache and
# loaded at run time.
grammar = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp", rev = "d4bbe18103c3380c6454085e589d2610938da142" }

[unit]
# A unit's display name on its definition line, when the queries don't say: the last group.
name = ['^[[:space:]]*((public|protected|private|internal|static|sealed|abstract|partial|readonly)[[:space:]]+)*(class|interface|struct|enum|record)[[:space:]]+([[:alnum:]_]+)']

# `[test]` and `[imports]` are left out: a C# project's test layout is a convention of its
# solution, and a `using` names a namespace, not a file.

# The code spellbook writes where a generator leaves a hole: one template per kind, filled with
# the hole's name and instruction. Every placeholder must parse where its kind belongs.
[holes]
ident = "todo_{= name =}"
type = "object"
expr = "default! /* hole {= name =}: {= instruction =} */"
block = "throw new System.NotImplementedException(\"hole {= name =}: {= instruction =}\");"
stmt = "throw new System.NotImplementedException(\"hole {= name =}: {= instruction =}\");"

# What spellbook's anchors cannot read from the code: the separator a list of one item, or of
# none, takes when an item is put into it (a longer list shows its own).
[syntax]
list_separator = ","

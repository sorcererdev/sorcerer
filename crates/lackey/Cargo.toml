[package]
name = "sorcerer-lackey"
description = "Lackey: a coding agent whose whole interface is your editor, run on your own Claude Code"
keywords = ["coding-agent", "claude", "lsp", "editor", "ai"]
categories = ["development-tools", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "lackey"

[[bin]]
name = "lackey"
path = "src/main.rs"

# The fake `claude` the harness tests run: a program, so it runs on every platform. It reads a
# script, speaks stream-json, and really runs the MCP server and the hooks it is given. It is
# built only with the `fake-claude` feature, which the tests turn on through the dev-dependency
# on this crate below: `cargo install` and the release build `lackey` alone.
[[bin]]
name = "lackey-fake-claude"
path = "tests/support/fake_claude.rs"
required-features = ["fake-claude"]
test = false
doc = false

[features]
fake-claude = []

[dependencies]
sorcerer-core.workspace = true
sorcerer-models.workspace = true
sorcerer-lsp.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
similar.workspace = true
tree-sitter.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
crossbeam-channel.workspace = true
which.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Itself, with the test program on (see `lackey-fake-claude` above).
sorcerer-lackey = { path = ".", features = ["fake-claude"] }

[lints]
workspace = true

[package.metadata.dist]
include = ["../../NOTICE"]

# The release carries `lackey` alone, not the test program (dist does not read
# required-features): one entry per target in dist-workspace.toml.
[package.metadata.dist.binaries]
aarch64-apple-darwin = ["lackey"]
x86_64-apple-darwin = ["lackey"]
x86_64-unknown-linux-gnu = ["lackey"]
aarch64-unknown-linux-gnu = ["lackey"]
x86_64-pc-windows-msvc = ["lackey"]

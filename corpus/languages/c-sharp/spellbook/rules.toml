# One rule, with a fix: the booking service logs through a helper, never Console.WriteLine.
[rules.no-writeline-in-reservations]
files   = "Reservations/*.cs"
exclude = ["**/*Tests.cs"]
match   = { kind = "invocation_expression", regex = "^Console\\.WriteLine\\(" }
message = "reservation code does not print: write it through a helper"

[[rules.no-writeline-in-reservations.fixes]]
generator = "thing"
label     = "Write it through a new helper"
with      = { name = "audit" }
replace   = [
  { enclosing = ["expression_statement"], text = "{= ? audit_call: stmt | the same as {= finding =} through the helper =}" },
]

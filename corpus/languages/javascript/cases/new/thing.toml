# A thing: one hole of each kind in [holes], each parsing where it is.
generator = "thing"
inputs    = { name = "audit" }

[[holes]]
name = "body"
kind = "block"
file = "booking/audit.js"
line = 4

[[holes]]
name = "helper"
kind = "ident"
file = "booking/audit.js"
line = 2

[[holes]]
name = "limit"
kind = "expr"
file = "booking/audit.js"
line = 3

# One rule, with a fix: the booking service logs through a helper, never print().
[rules.no-print-in-booking]
files   = "booking/*.py"
exclude = ["**/*__test.py"]
match   = { kind = "call", regex = "^print\\(" }
message = "booking code does not print: write it through a helper"

[[rules.no-print-in-booking.fixes]]
generator = "thing"
label     = "Write it through a new helper"
with      = { name = "audit" }
replace   = [
  { enclosing = ["expression_statement"], text = "{= ? audit_call: block | the same as {= finding =} through the helper =}" },
]

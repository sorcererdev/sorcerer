# Triage cases: one region each, the text a person typed, with the file around it and the session.
#
# Each case starts from `scenarios/<scenario>/files/<file>` (the file as the session left it).
# `prior` edits, when given, were typed and looked at earlier (they are in the session's changes);
# `edit` is the change of the last look. Each edit is [find, replace]: the first `find` in the
# text is replaced. `region` is the region the change cuts (its text, as cut). `label` is what
# lackey should make of it:
#   instruction / question / claim   an ask of that kind
#   ask                              an ask of any kind counts (a bare `?`)
#   none                             nothing should show
# `hard = true` marks a negative built to look like an ask.


name        = "Query"
summary     = "A query of a service, with its test"
description = "queries/NAME.py (its Input, its Result, handle; no failures) and NAME__test.py, a failing stub wired up, ready for the first case"
language    = "python"
examples    = ["spellbook new query --set service=booking --set query=find_free_tables"]

[inputs.app]
type   = "enum"
one_of = "apps"
prompt = "The app (the folder under src/ with main.py)"

[inputs.service]
type   = "enum"
one_of = "services"
prompt = "The service it belongs to"

[inputs.query]
type   = "ident"
prompt = "The query, what it answers (find_free_tables, get_day_schedule)"

[derive]
Query  = "{= query|pascal =}"
query_ = "{= query|snake =}"
dir    = "src/{= app =}/{= service|snake =}/queries"
module = "{= app =}.{= service|snake =}.queries.{= query|snake =}"

[query.apps]
glob  = "src/*/main.py"
value = "parent folder"

[query.services]
glob  = "src/{= app =}/*/models"
value = "parent folder"

[[edits]]
create    = "{= dir =}/__init__.py"
text      = ""
on_exists = "skip"

[[edits]]
create   = "{= dir =}/{= query_ =}.py"
template = "query.py.dt"

[[edits]]
create   = "{= dir =}/{= query_ =}__test.py"
template = "query__test.py.dt"

# The docstring starts as the name in words.
[holes.purpose]
source = "derived"
value  = "{= query|sentence =}."

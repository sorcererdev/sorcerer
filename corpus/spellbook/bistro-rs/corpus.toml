# bistro-rs: spellbook's Rust corpus, on a copy of scry's bistro-rs base. The corpus test
# (crates/spellbook/tests/corpus.rs) reads this file.
name     = "bistro-rs"
language = "rust"
base     = "../../scry/bistro-rs/base"
# The five mod.rs files with their region markers, laid over the base for every case that does
# not say base = "shared".
overlay  = "base"

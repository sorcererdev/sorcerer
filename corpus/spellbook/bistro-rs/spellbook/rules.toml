# The conventions of bistro-rs, checked by `spellbook check` and on save in the editor.
# A rule is an error unless it says `severity = "warn"` or `"hint"`.

# A command returns its failures (they are its Failure enum's cases); a panic skips every caller's
# handling. `todo!` is left out: it is the placeholder a generator leaves in a hole, and conjure
# or a person replaces it. (`.unwrap()` is not a rule here: a command file holds its tests, and a
# test may unwrap; a rule cannot yet tell the two apart.)
[rules.commands-no-panic]
files    = "src/{service}/commands/*.rs"
exclude  = ["**/mod.rs"]
match    = { kind = "macro_invocation", regex = "^(panic|unreachable|unimplemented)!" }
message  = "A command returns its failure instead of panicking"

# Commands and queries reach data through ports: the file system belongs in an adapter
# (ports/PORT/file.rs), which main.rs chooses.
[rules.commands-use-ports]
files    = "src/{service}/{kind}/*.rs"
exclude  = ["**/mod.rs", "src/web/**"]
match    = { any = [
  { kind = "use_declaration", regex = "\\bstd::(fs\\b|\\{[^}]*\\bfs\\b)" },
  { kind = "scoped_identifier", regex = "^(std::)?fs::\\w+$" },
] }
message  = "Commands and queries talk to ports, not the file system (ports & adapters)"

# A port the service already has: the `use` goes, a statement becomes a hole saying what it did.
[[rules.commands-use-ports.fixes]]
generator = "use-port"
label     = "Use a port the service has"
with      = { service = "{= service =}", kind = "{= kind =}", unit = "{= stem =}" }
replace   = [
  { enclosing = ["use_declaration"], text = "" },
  { enclosing = ["expression_statement", "let_declaration"], text = "{= ? port_call: stmt | the same as {= finding =} through self.{= param =} =}" },
]

# A port the service does not have yet: the port's two files, its `pub mod` line in ports/mod.rs
# (the ports region), and the command rewired as use-port does, in one plan.
[[rules.commands-use-ports.fixes]]
generator = "add-port"
label     = "Add a port and use it"
with      = { service = "{= service =}", kind = "{= kind =}", unit = "{= stem =}" }
replace   = [
  { enclosing = ["use_declaration"], text = "" },
  { enclosing = ["expression_statement", "let_declaration"], text = "{= ? port_call: stmt | the same as {= finding =} through self.{= param =} =}" },
]

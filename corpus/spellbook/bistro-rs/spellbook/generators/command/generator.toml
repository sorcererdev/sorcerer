name        = "Command"
summary     = "A command of a service, with its test"
description = "commands/NAME.rs: its Input, a failure, handle, and a test calling it (red until handle is written). Add `pub mod NAME;` to commands/mod.rs by hand: in milestone 1 the mod line is the person's."
language    = "rust"
examples    = ["spellbook new command --set service=booking --set command=cancel_table"]

[inputs.service]
type   = "enum"
one_of = "services"
prompt = "The service it belongs to"

[inputs.command]
type   = "ident"
prompt = "The command, a verb phrase (cancel_booking, close_table)"

[derive]
Command  = "{= command|pascal =}"
command_ = "{= command|snake =}"
dir      = "src/{= service|snake =}/commands"

[query.services]
glob  = "src/*/commands"
value = "parent folder"

[[edits]]
create   = "{= dir =}/{= command_ =}.rs"
template = "command.rs.dt"

# The doc line starts as the name in words.
[holes.purpose]
source = "derived"
value  = "{= command|sentence =}."

[holes.value]
source = "derived"
value  = "()"

[holes.failure]
source = "derived"
value  = "NotFound"

name        = "Add a port and use it"
summary     = "A new port for the service (its trait and an in-memory adapter), taken by a command or query"
description = "The port generator's two files, then use-port on the command or query, in one plan; ports/mod.rs lists the new port through the ports region."
language    = "rust"
examples    = ["spellbook new add-port --set service=booking --set kind=commands --set unit=seat_walk_in --set port=clock"]

[inputs.service]
type   = "enum"
one_of = "services"
prompt = "The service it belongs to"

[inputs.kind]
type    = "enum"
choices = ["commands", "queries"]
prompt  = "A command or a query"

[inputs.unit]
type   = "ident"
prompt = "The command or query (its module's name)"

[inputs.port]
type   = "ident"
prompt = "The new port (clock, email_sender)"

[query.services]
glob  = "src/*/ports"
value = "parent folder"

[[uses]]
generator = "port"
with      = { service = "{= service =}", port = "{= port =}" }

[[uses]]
generator = "use-port"
with      = { service = "{= service =}", kind = "{= kind =}", unit = "{= unit =}", port = "{= port =}" }

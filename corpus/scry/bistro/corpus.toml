# bistro: scry's Python corpus. The eval (crates/scry/tests/eval.rs) reads this file.
name = "bistro"
language = "python"
sets = ["V-must", "B", "T", "N", "V-taste"]

# Passing scores move only by a ruling recorded here, with its date and reason.
[passing_scores]
v_must_min = 16
b_min = 6
t_mean_max = 0.5
n_mean_max = 0.5

# The eval run of 2026-11-18 at scry 8e5e255: V-must 18 cases, 17 with a hit shown, 1.222 shown a
# case; B 8, 6, 0.875; T 18, 0, 0.000; N 8, 0, 0.125; V-taste 6, 0, 0.000.
[baseline]
recorded = "2026-11-18"
scry = "8e5e255"
review_model = "sonnet"
v_must = 17
b = 6
t_mean = 0.0
# 2026-11-20: a true finding nobody planted (labelled `unplanted`) is left out of the shown count,
# so n_mean reads 0.0 (n04's phone-column finding); the recording is unchanged.
n_mean = 0.0

# The bare table: the same cases reviewed with no steering at all (no scry.toml), what a stranger
# gets before writing rules. Recorded under bare/. Scores are set once, from the recording.
[bare]
sets = ["B", "T", "N"]

# Set 2026-11-21 from the first bare recording by the corpus rule: B hits minus one, 0.5 shown a case
# on T and N. A bare finding is a hit by the exact statement listed in bare/labels.json (judged by the
# builder against each case's expect; the user reads them, as for the rules-on labels).
[bare.passing_scores]
b_min = 6
t_mean_max = 0.5
n_mean_max = 0.5

# The first bare recording, 2026-11-21 (reviews via claude -p, claim checks with Jev guarding, no scry.toml).
[bare.baseline]
recorded = "2026-11-21"
scry = "1c144e0"
review_model = "sonnet"
b = 7
# 2026-11-21: true findings nobody planted (labelled `unplanted` in bare/labels.json) are left out
# of the shown count; the recording is unchanged (before: T 0.056, N 0.000).
t_mean = 0.0
n_mean = 0.0

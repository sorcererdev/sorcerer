[regions.adapters-folders]
file    = "crates/*/src/adapters/mod.rs"
exclude = ["crates/sorcerer-models/src/adapters/mod.rs"]
query   = { glob = "{= dir =}/*/mod.rs" }
item    = "pub mod {= parent =};"
init_at = ["after last line matching ^pub mod ", "end of imports"]


name        = "Use case"
summary     = "A use case: one feature's whole API, its request and its public function"
description = """
usecases/USECASE.rs holds the request the feature takes and the one public function callers use \
(cli, the editor server, another crate). It uses domain/ and ports/ only: pass each port it needs as \
`&dyn Port`, never an adapter. Its steps are private helpers below it, or private modules once it \
grows (usecases/USECASE/). Spellbook writes new files only: add `pub mod USECASE;` to usecases/mod.rs \
yourself."""
language    = "rust"
examples    = ["spellbook new usecase --set crate=scry --set usecase=list_findings"]

[inputs.crate]
type   = "enum"
one_of = "crates"
prompt = "The crate the feature belongs to (the folder under crates/; one with layers, not sorcerer-lsp)"

[inputs.usecase]
type   = "ident"
prompt = "The feature, a verb phrase (list_findings, review_change)"

[query.crates]
glob  = "crates/*/src"
value = "parent folder"

[derive]
Usecase = "{= usecase|pascal =}"

[[edits]]
create   = "crates/{= crate =}/src/usecases/{= usecase|snake =}.rs"
template = "usecase.rs.dt"

[holes.purpose]
source = "derived"
value  = "{= usecase|sentence =}."

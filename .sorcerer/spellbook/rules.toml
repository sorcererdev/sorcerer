# Sorcerer's own conventions, checked by `spellbook check` and on save in the editor.
#
# These are the mechanical half of the prose rules in `.sorcerer/scry.toml` (which scry reviews
# with a model): only what a syntax match names exactly. The layer rules mirror
# `scripts/layers` and the mod.rs rule mirrors `scripts/mod-rs-declarations`; CI runs both
# scripts, so these are errors. Two things the scripts do that a match cannot: a path that climbs
# into another layer with `super::super::…`, and skipping a file's `#[cfg(test)] mod tests`
# (a test may set up files). A test module that needs to break a rule says so with an allow.

# --- domain-is-pure -------------------------------------------------------------------------

[rules.domain-uses-no-other-layer]
files    = "crates/{crate}/src/domain/**.rs"
match    = { any = [
  { kind = "use_declaration", regex = "\\bcrate::(\\{[^}]*[{,]\\s*)?(ports|usecases|adapters|cli)\\b" },
  { kind = "scoped_identifier", regex = "^crate::(ports|usecases|adapters|cli)\\b" },
  { kind = "use_declaration", regex = "\\bsorcerer_\\w+::adapters\\b" },
  { kind = "scoped_identifier", regex = "^sorcerer_\\w+::adapters\\b" },
] }
message  = "domain/ depends on nothing else in its crate: no ports, usecases, adapters or cli (and no other crate's adapters)"
severity = "error"
why      = "scry.toml domain-is-pure; scripts/layers"

[rules.domain-does-no-io]
files    = "crates/{crate}/src/domain/**.rs"
match    = { any = [
  { kind = "use_declaration", regex = "\\bstd::(fs|process|env|net)\\b|\\bstd::\\{[^}]*\\b(fs|process|env|net)\\b|\\bstd::io::stdin\\b|\\breqwest\\b|\\bSystemTime\\b" },
  { kind = "scoped_identifier", regex = "^(std::(fs|process|env|net)\\b|std::io::stdin$|std::time::SystemTime$|reqwest::|(\\w+::)*(Instant|Utc|Local)::now$)" },
  { kind = "field_identifier", regex = "^canonicalize$" },
] }
message  = "domain/ does no I/O: no files, processes, environment, network, standard input or clock; take the value as an argument or go through a port"
severity = "error"
why      = "scry.toml domain-is-pure; scripts/layers"

# --- the dependency rule for the other layers -------------------------------------------------

[rules.ports-depend-on-domain-only]
files    = "crates/{crate}/src/ports/**.rs"
match    = { any = [
  { kind = "use_declaration", regex = "\\bcrate::(\\{[^}]*[{,]\\s*)?(usecases|adapters|cli)\\b" },
  { kind = "scoped_identifier", regex = "^crate::(usecases|adapters|cli)\\b" },
  { kind = "use_declaration", regex = "\\bsorcerer_\\w+::adapters\\b" },
  { kind = "scoped_identifier", regex = "^sorcerer_\\w+::adapters\\b" },
] }
message  = "ports/ uses the domain only: no usecases, adapters or cli"
severity = "error"
why      = "scry.toml ports-are-traits; scripts/layers"

[rules.usecases-depend-inward]
files    = "crates/{crate}/src/usecases/**.rs"
match    = { any = [
  { kind = "use_declaration", regex = "\\bcrate::(\\{[^}]*[{,]\\s*)?(adapters|cli)\\b" },
  { kind = "scoped_identifier", regex = "^crate::(adapters|cli)\\b" },
  { kind = "use_declaration", regex = "\\bsorcerer_\\w+::adapters\\b" },
  { kind = "scoped_identifier", regex = "^sorcerer_\\w+::adapters\\b" },
] }
message  = "usecases/ uses domain and ports only: it never names an adapter or the cli"
severity = "error"
why      = "scry.toml usecases-depend-inward; scripts/layers"

[rules.adapters-do-not-use-cli]
files    = "crates/{crate}/src/adapters/**.rs"
match    = { any = [
  { kind = "use_declaration", regex = "\\bcrate::(\\{[^}]*[{,]\\s*)?cli\\b" },
  { kind = "scoped_identifier", regex = "^crate::cli\\b" },
] }
message  = "adapters/ never uses the cli: the cli drives the use cases, not the other way round"
severity = "error"
why      = "scry.toml adapters-implement-ports; scripts/layers"

# --- mod.rs holds declarations only -------------------------------------------------------------

[rules.mod-rs-declarations-only]
files    = "crates/**/mod.rs"
exclude  = ["**/corpus/**"]
query    = """
(source_file
  [(function_item) (struct_item) (enum_item) (union_item) (impl_item) (trait_item)
   (const_item) (static_item) (type_item) (macro_definition) (macro_invocation)
   (foreign_mod_item) (extern_crate_declaration)
   (mod_item body: (declaration_list))] @finding)
"""
message  = "a mod.rs holds only mod and use lines; move this to a file named for what it does"
severity = "error"
why      = "mod.rs shows the tree, named files show the work; scripts/mod-rs-declarations"

# --- the-engine-knows-no-language ---------------------------------------------------------------
# The mechanical half of scry.toml's the-engine-knows-no-language, mirroring
# scripts/no-language-names: code in crates/*/src reaches a language only through tree-sitter's
# captures and the language's data (crates/sorcerer-core/library/languages/<name>/). A grammar's
# field or node kind, a language's name or extension, or a tool, written into the engine, is a
# finding; name it in a query capture or a language.toml key instead.

[rules.no-grammar-field-in-the-engine]
files    = "crates/{crate}/src/**.rs"
query    = """
(call_expression
  function: (field_expression field: (field_identifier) @method)
  arguments: (arguments . [(string_literal) (raw_string_literal)])
  (#any-of? @method "child_by_field_name" "field_id_for_name")) @finding
(call_expression
  function: (field_expression field: (field_identifier) @method)
  arguments: (arguments . (integer_literal))
  (#eq? @method "child_by_field_id")) @finding
"""
message  = "the engine names no grammar field: capture the node in the language's queries and read the capture"
severity = "error"
why      = "scry.toml the-engine-knows-no-language; scripts/no-language-names"

[rules.no-node-kind-in-the-engine]
files    = "crates/{crate}/src/**.rs"
query    = """
(binary_expression
  left: (call_expression function: (field_expression field: (field_identifier) @kind))
  operator: ["==" "!="]
  right: [(string_literal) (raw_string_literal)]
  (#eq? @kind "kind")) @finding
(binary_expression
  left: [(string_literal) (raw_string_literal)]
  operator: ["==" "!="]
  right: (call_expression function: (field_expression field: (field_identifier) @kind))
  (#eq? @kind "kind")) @finding
(call_expression
  function: (field_expression
    value: (call_expression function: (field_expression field: (field_identifier) @kind))
    field: (field_identifier) @method)
  arguments: (arguments . [(string_literal) (raw_string_literal)])
  (#eq? @kind "kind")
  (#any-of? @method "contains" "starts_with" "ends_with")) @finding
(match_expression
  value: (call_expression function: (field_expression field: (field_identifier) @kind))
  body: (match_block (match_arm pattern: (match_pattern [(string_literal) (raw_string_literal)]) @finding))
  (#eq? @kind "kind"))
"""
message  = "the engine names no node kind: capture the node in the language's queries (a comment is @comment.outer, a body @function.inner) and read the capture"
severity = "error"
why      = "scry.toml the-engine-knows-no-language; scripts/no-language-names"

# The code languages (those whose queries capture units) and their `files` extensions, as
# scripts/no-language-names reads them from crates/sorcerer-core/library/languages/; that
# script fails when these lists drift from the library.
[rules.no-language-name-in-the-engine]
files    = "crates/{crate}/src/**.rs"
# "Bash" is Claude Code's tool name in lackey's permission and status code, not the language.
exclude  = ["crates/lackey/src/adapters/claude_agent.rs", "crates/lackey/src/domain/status.rs", "crates/lackey/src/usecases/run_task/permissions.rs"]
match    = { any = [
  { kind = "string_literal", regex = "(?i)^\"(python|rust|bash|sql)\"$|\\.(py|rs|sh|bash|sql)\"$" },
  { kind = "raw_string_literal", regex = "(?i)\\.(py|rs|sh|bash|sql)\"#*$" },
] }
message  = "the engine names no language or file extension: a language is files under crates/sorcerer-core/library/languages/<name>/"
severity = "error"
why      = "scry.toml the-engine-knows-no-language; scripts/no-language-names"

[rules.no-tool-in-the-engine]
files    = "crates/{crate}/src/**.rs"
match    = { any = [
  { kind = "string_literal", regex = "(^|[^\\w-])(ruff|black|mypy|pyright|pytest|pip|pipx|uv|poetry|tox|cargo|rustc|rustfmt|rustup|clippy|npm|npx|yarn|pnpm|eslint|prettier|tsc|jest|vitest|gofmt|mvn|gradle|dotnet|deno|bun|biome|golangci-lint|shellcheck|sqlfluff|yamllint|taplo|markdownlint)([^\\w-]|$)" },
  { kind = "raw_string_literal", regex = "(^|[^\\w-])(ruff|black|mypy|pyright|pytest|pip|pipx|uv|poetry|tox|cargo|rustc|rustfmt|rustup|clippy|npm|npx|yarn|pnpm|eslint|prettier|tsc|jest|vitest|gofmt|mvn|gradle|dotnet|deno|bun|biome|golangci-lint|shellcheck|sqlfluff|yamllint|taplo|markdownlint)([^\\w-]|$)" },
  # go and node are words too: a tool only as a command
  { kind = "string_literal", regex = "^\"(go\\s+(test|build|run|vet|fmt|mod|get|install)\\b|node(\\s+-e\\b|\\s+\\S+\\.m?js\\b|\"$))" },
] }
message  = "the engine names no tool (formatter, linter, test runner, package manager): the person's configuration names tools, the engine runs what it is given"
severity = "error"
why      = "scry.toml the-engine-knows-no-language; scripts/no-language-names"

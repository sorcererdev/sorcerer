[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sorcererdev/sorcerer"

[workspace.dependencies]
sorcerer-core = { path = "crates/sorcerer-core", version = "0.2.0" }
sorcerer-models = { path = "crates/sorcerer-models", version = "0.2.0" }
sorcerer-lsp = { path = "crates/sorcerer-lsp", version = "0.2.0" }
tree-sitter = "0.25"
tree-sitter-language = "0.1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
which = "7"
dunce = "1.0.5"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
regex = "1"
similar = "3"
tempfile = "3"
mockito = "1"
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"
crossbeam-channel = "0.5"

[workspace.lints.clippy]
too_many_lines = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build book/user
      - run: mdbook build book/internals
      - run: scripts/no-language-names
      - run: scripts/layers
      - run: bash scripts/layers-test
      - run: bash scripts/book-check-test
      - if: github.event_name == 'pull_request'
        run: scripts/book-check origin/${{ github.base_ref }}

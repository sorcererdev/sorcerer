name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build book/user
      - run: mdbook build book/internals
      - run: scripts/no-language-names
      - run: scripts/layers
      - run: bash scripts/layers-test
      - run: bash scripts/book-check-test
      - if: github.event_name == 'pull_request'
        run: scripts/book-check origin/${{ github.base_ref }}
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode/scry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/scry/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

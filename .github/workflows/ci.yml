name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # the checks below read the source, which is the same on every platform
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - if: matrix.os == 'ubuntu-latest'
        run: mdbook build book/user
      - if: matrix.os == 'ubuntu-latest'
        run: mdbook build book/internals
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/no-language-names
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/no-language-names-test
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/mod-rs-declarations
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/mod-rs-declarations-test
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/layers
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/layers-test
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/platform
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/platform-test
      # the repository's own conventions (.sorcerer/spellbook/rules.toml), checked by spellbook
      - if: matrix.os == 'ubuntu-latest'
        run: cargo run -q -p sorcerer-spellbook --bin spellbook -- check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo run -q -p sorcerer-spellbook --bin spellbook -- sync --check
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/book-check-test
      - if: matrix.os == 'ubuntu-latest'
        run: cargo publish --workspace --dry-run
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.34.0
      # release.yml is generated by dist (one line patched, see the script); dist plan reads
      # dist-workspace.toml
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/release-workflow --check
      - if: matrix.os == 'ubuntu-latest'
        run: dist plan
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: scripts/book-check origin/${{ github.base_ref }}
  vscode:
    # the end-to-end tests of the four extensions. scry: ubuntu runs both suites (the fake
    # server's is Python, which VS Code's client cannot start on Windows), windows runs the
    # download suite against the real scry built here and served as a local release. conjure:
    # ubuntu and windows run its one suite, the real conjure with a fake claude. spellbook:
    # ubuntu and windows run its one suite, the real spellbook, no model. apprentice: ubuntu and
    # windows run its one suite, the real apprentice with its fake claude (built only with the
    # fake-claude feature); ubuntu also packages it as a .vsix artifact, to try a branch.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        extension: [scry, conjure, spellbook, apprentice]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editors/vscode/${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/${{ matrix.extension }}/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # the download, lookup and offer code is shared by product name, as copies; they must not drift
      - if: matrix.os == 'ubuntu-latest' && matrix.extension == 'conjure'
        working-directory: .
        run: |
          for f in binary download offer working inline; do
            diff editors/vscode/scry/src/$f.ts editors/vscode/conjure/src/$f.ts
          done
      - if: matrix.os == 'ubuntu-latest' && matrix.extension == 'spellbook'
        working-directory: .
        run: |
          for f in binary download offer; do
            diff editors/vscode/scry/src/$f.ts editors/vscode/spellbook/src/$f.ts
          done
      - if: matrix.os == 'ubuntu-latest' && matrix.extension == 'apprentice'
        working-directory: .
        run: |
          for f in binary download offer working inline; do
            diff editors/vscode/scry/src/$f.ts editors/vscode/apprentice/src/$f.ts
          done
      # the VS Code the e2e suites run, kept a week: a cold download or the stable-version
      # lookup times out now and then, and with a cached build @vscode/test-electron falls back
      # to it when the lookup fails
      - id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: editors/vscode/${{ matrix.extension }}/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ matrix.extension }}-${{ steps.week.outputs.week }}
          restore-keys: vscode-test-${{ runner.os }}-${{ matrix.extension }}-
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - if: matrix.extension == 'scry'
        run: cargo build -p sorcerer-scry
      - if: matrix.extension == 'conjure'
        run: |
          cargo build -p sorcerer-conjure
          cargo build -p sorcerer-models --bin fake-claude
      - if: matrix.extension == 'spellbook'
        run: cargo build -p sorcerer-spellbook
      - if: matrix.extension == 'apprentice'
        run: cargo build -p sorcerer-apprentice --features fake-claude
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e
      - if: matrix.os == 'windows-latest' && matrix.extension == 'scry'
        run: npm run test:e2e
        env:
          SCRY_E2E_SUITES: download
      - if: matrix.os == 'windows-latest' && matrix.extension == 'conjure'
        run: npm run test:e2e
      - if: matrix.os == 'windows-latest' && matrix.extension == 'spellbook'
        run: npm run test:e2e
      - if: matrix.os == 'windows-latest' && matrix.extension == 'apprentice'
        run: npm run test:e2e
      - if: matrix.os == 'ubuntu-latest' && matrix.extension == 'apprentice'
        run: npm run package
      - if: matrix.os == 'ubuntu-latest' && matrix.extension == 'apprentice'
        uses: actions/upload-artifact@v4
        with:
          name: apprentice-vsix
          path: editors/vscode/apprentice/*.vsix
          if-no-files-found: error

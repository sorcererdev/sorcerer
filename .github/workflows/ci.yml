name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # the checks below read the source, which is the same on every platform
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - if: matrix.os == 'ubuntu-latest'
        run: mdbook build book/user
      - if: matrix.os == 'ubuntu-latest'
        run: mdbook build book/internals
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/no-language-names
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/layers
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/layers-test
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/platform
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/platform-test
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/book-check-test
      - if: matrix.os == 'ubuntu-latest'
        run: cargo publish --workspace --dry-run
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.34.0
      # release.yml is generated by dist (one line patched, see the script); dist plan reads
      # dist-workspace.toml
      - if: matrix.os == 'ubuntu-latest'
        run: scripts/release-workflow --check
      - if: matrix.os == 'ubuntu-latest'
        run: dist plan
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: scripts/book-check origin/${{ github.base_ref }}
  vscode:
    # the end-to-end tests: ubuntu runs both suites (the fake server's is Python, which VS
    # Code's client cannot start on Windows); windows runs the download suite, against the
    # real scry built here and served as a local release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editors/vscode/scry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/scry/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: cargo build -p sorcerer-scry
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e
      - if: matrix.os == 'windows-latest'
        run: npm run test:e2e
        env:
          SCRY_E2E_SUITES: download

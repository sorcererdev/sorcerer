# After a release: install it the way the README says, on machines with nothing else, and see
# it work. Run by hand (Actions → smoke → Run workflow, with the version just released).
#
# linux: a bare ubuntu:24.04 container (no Rust, no C compiler); the README's shell lines (scry, conjure, spellbook and
#   lackey; the last three get `--version`, no live call: lackey needs a signed-in claude); one
#   live review of the bistro demo with a planted bug (scripts/smoke-review, at most $0.20).
# windows: the README's PowerShell lines; `scry doctor` on the bistro demo with a TypeScript
#   corner (corpus/languages/typescript/base); no live review.
# Both check that every grammar was downloaded, not compiled, typescript's among them.
name: smoke
on:
  workflow_dispatch:
    inputs:
      version:
        description: "the version just released, such as 0.1.0"
        required: true
        type: string
jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - uses: actions/checkout@v4
      - name: install with the README's line
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-scry-installer.sh | sh
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-conjure-installer.sh | sh
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-spellbook-installer.sh | sh
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-lackey-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: nothing to build with
        shell: bash
        run: |
          for tool in cc gcc clang cargo; do
            if command -v "$tool"; then echo "$tool is on PATH"; exit 1; fi
          done
      - name: the version asked for
        shell: bash
        run: |
          test "$(scry --version)" = "scry ${{ inputs.version }}"
          test "$(conjure --version)" = "conjure ${{ inputs.version }}"
          test "$(spellbook --version)" = "spellbook ${{ inputs.version }}"
          test "$(lackey --version)" = "lackey ${{ inputs.version }}"
      - name: one live review
        shell: bash
        run: scripts/smoke-review
  windows:
    runs-on: windows-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: install with the README's line
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-scry-installer.ps1 | iex"
          powershell -ExecutionPolicy ByPass -c "irm https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-conjure-installer.ps1 | iex"
          powershell -ExecutionPolicy ByPass -c "irm https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-spellbook-installer.ps1 | iex"
          powershell -ExecutionPolicy ByPass -c "irm https://github.com/sorcererdev/sorcerer/releases/latest/download/sorcerer-lackey-installer.ps1 | iex"
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: the version asked for
        shell: pwsh
        run: |
          $version = scry --version
          if ($version -ne "scry ${{ inputs.version }}") { throw "scry --version says $version" }
          $conjure = conjure --version
          if ($conjure -ne "conjure ${{ inputs.version }}") { throw "conjure --version says $conjure" }
          $spellbook = spellbook --version
          if ($spellbook -ne "spellbook ${{ inputs.version }}") { throw "spellbook --version says $spellbook" }
          $lackey = lackey --version
          if ($lackey -ne "lackey ${{ inputs.version }}") { throw "lackey --version says $lackey" }
      - name: doctor on the bistro demo
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP bistro
          Copy-Item -Recurse corpus/scry/bistro/base $work
          Copy-Item -Recurse corpus/languages/typescript/base (Join-Path $work web)
          Set-Location $work
          git init -q -b main
          git add -A
          git -c user.name=smoke -c user.email=smoke@example.com commit -q -m base
          $doctor = scry doctor
          $code = $LASTEXITCODE
          $doctor
          if ($code -ne 0) { throw "doctor exited $code" }
          if (-not ($doctor | Select-String -Pattern '^languages +ok .*typescript.*downloaded')) { throw "the languages row does not name typescript as downloaded" }
          if ($doctor | Select-String -Pattern '^languages .*built with') { throw "a grammar was built, not downloaded" }
